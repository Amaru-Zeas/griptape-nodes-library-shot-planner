[project]
name = "griptape-nodes-library-shot-planner"
version = "0.1.0"
description = "Seedance Omni Prompt V9 and Image Omni Prompt for Griptape Nodes."
authors = [
    { name = "Griptape Community" }
]
requires-python = ">=3.11"
dependencies = [
    "griptape-nodes",
]

[tool.uv.sources]
griptape-nodes = { git = "https://github.com/griptape-ai/griptape-nodes", rev = "latest" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shot_planner_nodes"]
